services:
  app:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health_monitor_bot
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    environment:
      - TOKEN=${TOKEN}
      - PROXY_URL=${PROXY_URL:-}
      - DB_PATH=/app/data/measurements.db
      - ALEMBIC_INI=/app/alembic.ini
      - LOG_PATH=/app/logs/bot.log
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$PROXY_URL\" ]; then curl -fsS --proxy \"$$PROXY_URL\" \"https://api.telegram.org/bot$$TOKEN/getMe\"; else curl -fsS \"https://api.telegram.org/bot$$TOKEN/getMe\"; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
  app-logs:
